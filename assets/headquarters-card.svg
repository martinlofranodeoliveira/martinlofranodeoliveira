<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
  <title id="title">Sede digital 3D — explore a LOFRANO</title>
  <desc id="desc">Conheça os ambientes. Explore a visão pública das equipes. Ilustração arquitetônica original.</desc>
