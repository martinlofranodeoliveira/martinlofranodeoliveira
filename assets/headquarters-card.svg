    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".065"/><stop offset="1" stop-color="#fff" stop-opacity=".01"/></linearGradient>
    <clipPath id="clip"><rect width="600" height="220" rx="18"/></clipPath>
  </defs>
